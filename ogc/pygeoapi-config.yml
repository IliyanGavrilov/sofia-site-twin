# Publishes the twin's PostGIS tables as OGC API - Features collections.
# Reference: https://docs.pygeoapi.io/en/latest/data-publishing/ogcapi-features.html
server:
  bind: {host: 0.0.0.0, port: 80}
  url: http://localhost:5000
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  languages: [en-US]
  limits: {default_items: 100, max_items: 5000}
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; OpenStreetMap contributors'

logging:
  level: ERROR

metadata:
  identification:
    title: Sofia Site Twin
    description: Facilities and demand cells of the Sofia site-selection digital twin
    keywords: [digital twin, site selection, sofia]
    terms_of_service: https://creativecommons.org/licenses/by/4.0/
    url: https://github.com/IliyanGavrilov/sofia-site-twin
  license:
    name: CC-BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  provider:
    name: Sofia Site Twin
    url: https://github.com/IliyanGavrilov/sofia-site-twin
  contact:
    name: Sofia Site Twin

resources:
  facilities:
    type: collection
    title: Facilities
    description: Existing facilities by type (pharmacies, supermarkets, kindergartens)
    keywords: [facilities, poi]
    extents:
      spatial:
        bbox: [23.20, 42.60, 23.50, 42.75]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: PostgreSQL
        data:
          host: db
          dbname: ${POSTGRES_DB}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
        id_field: id
        table: facilities
        geom_field: geom
