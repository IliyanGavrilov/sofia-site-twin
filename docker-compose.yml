services:
  db:
    image: postgis/postgis:16-3.4
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  # OGC API - Features over the PostGIS tables: http://localhost:5000/collections
  ogc:
    image: geopython/pygeoapi:latest
    depends_on: [db]
    env_file: .env
    ports: ["5000:80"]
    volumes:
      - ./ogc/pygeoapi-config.yml:/pygeoapi/local.config.yml

  app:
    build: .
    depends_on: [db]
    env_file: .env
    ports: ["8501:8501"]

volumes:
  pgdata:
